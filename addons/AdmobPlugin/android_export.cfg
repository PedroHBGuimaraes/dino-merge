; Read by AdmobPlugin's export plugin (AdmobExportConfig.load_export_config_from_file)
; to write the com.google.android.gms.ads.APPLICATION_ID meta-data into the
; AndroidManifest. Without this file the plugin falls back to hunting for an
; Admob NODE in the main scene - and scripts/AdsManager.gd creates that node at
; runtime, so it would find nothing, ship an empty application id, and the
; Google Mobile Ads SDK crashes the app on launch when that happens.
;
; is_real=true keeps the REAL app id in the manifest for every export. That is
; the supported setup: the app id identifies the app, while which ad UNITS get
; requested is decided at runtime by AdsManager (test units on a debug build,
; real units on a release build), and Google's test units serve fine under a
; real app id.

[General]

is_real=true

[Debug]

app_id="ca-app-pub-1898448267289061~1570505998"

[Release]

app_id="ca-app-pub-1898448267289061~1570505998"
